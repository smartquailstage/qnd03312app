name: SmartQuail Django-app & Postgres Test qnd03312app

on:
  workflow_call:
  workflow_dispatch:

jobs:
  app_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      DJANGO_SECRET_KEY: test-key-not-good
      NAME_DB: QND03312APP_STDB
      PASSWORD_DB: Support1719@
      USER_DB: sqadmindb
      HOST_DB: smartquaildb
      PORT_DB: 5432 
      DB_IGNORE_SSL: "true"

    services:
      smartquaildb:
        image: postgres:16-alpine
        env: 
          POSTGRES_DB: QND03312APP_STDB
          POSTGRES_PASSWORD: Support1719@
          POSTGRES_USER: sqadmindb
          POSTGRES_HOST: smartquaildb
          POSTGRES_PORT: 5432 
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f "pks/sba.txt" ]; then
            pip3 install -r pks/sba.txt
          elif [ -f "pk.txt" ]; then
            pip3 install -r pk.txt
          fi
          pip3 install gunicorn

      - name: Start Gunicorn server check
        run: |
          gunicorn qnd03312app.wsgi:application --bind 0.0.0.0:8000 --workers 2 &
          sleep 5

      - name: Run Tests with Django
        run: |
          python3 manage.py test --settings=qnd03312app.settings.prod
